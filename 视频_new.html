<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteorological Videos | Yiding Luo</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px;
            margin-top: 30px;
        }

        .video-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: white;
            display: block;
        }

        .video-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            background: rgba(255, 255, 255, 0.12);
        }

        .video-thumb-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #16294d;
        }

        .video-thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .video-card:hover .video-thumb-wrap img {
            transform: scale(1.05);
        }

        /* 悬停播放按钮（居中） */
        .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0);
            transition: background 0.3s ease;
        }

        .play-overlay::after {
            content: '▶';
            font-size: 1.6rem;
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            color: #1e3c72;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s ease;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
        }

        .video-card:hover .play-overlay::after {
            opacity: 1;
            transform: scale(1);
        }

        /* 时长徽章（右下角） */
        .duration-badge {
            position: absolute;
            right: 8px;
            bottom: 8px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 3px 7px;
            border-radius: 5px;
            letter-spacing: 0.02em;
        }

        .video-info {
            padding: 14px 16px 16px;
        }

        .video-title {
            font-size: 1.02rem;
            font-weight: 600;
            line-height: 1.35;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-sub {
            font-size: 0.82rem;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <canvas id="windFieldCanvas"></canvas>

    <div class="container">
        <div class="language-toggle">
            <button class="language-btn" data-lang="zh" onclick="switchLanguage('zh', this)">中文</button>
            <button class="language-btn active" data-lang="en" onclick="switchLanguage('en', this)">English</button>
        </div>

        <div class="header">
            <h1 class="text" data-zh="气象科普视频" data-en="Meteorological Videos">Meteorological Videos</h1>
            <p class="text" data-zh="用生动的动画讲解天气现象背后的科学" data-en="Explaining the science behind weather phenomena with vivid animations">Explaining the science behind weather phenomena with vivid animations</p>
        </div>

        <div class="nav">
            <a href="Home.html#content"><span class="text" data-zh="返回内容" data-en="Back to Content">Back to Content</span></a>
            <a href="article.html"><span class="text" data-zh="科普文章" data-en="Articles">Articles</span></a>
            <a href="Home.html"><span class="text" data-zh="主页" data-en="Home">Home</span></a>
            <a href="app.html"><span class="text" data-zh="应用" data-en="Apps">Apps</span></a>
        </div>

        <!-- 视频网格由 JS 渲染 -->
        <div class="video-grid" id="video-grid"></div>

        <div class="footer">
            <p>&copy; 2026 <span class="text" data-zh="罗一丁｜华盛顿大学大气科学专业学生." data-en="Yiding (Leo) Luo｜Atmospheric Sciences Student at University of Washington.">Yiding (Leo) Luo｜Atmospheric Sciences Student at University of Washington.</span></p>
            <p><span class="text" data-zh="网页部分功能由DeepSeek生成" data-en="Some website functions are generated by DeepSeek AI">Some website functions are generated by DeepSeek AI</span></p>
        </div>
    </div>

    <script src="assets/js/wind-field.js"></script>
    <script src="assets/js/lang.js"></script>
    <script>
        // 视频数据（时长已验证：mvhd 解析）
        var VIDEO_DATA = [
            { page: 'CAPE.html', img: '视频/CAPE.png', zh: '如何预测强对流天气', en: 'How to Predict Strong Convection Weather', dur: '4:54' },
            { page: '云底高度.html', img: '视频/云底高度.png', zh: '如何计算云底高度', en: 'How to Calculate the Height of a Cloud Base', dur: '4:41' },
            { page: '彩虹.html', img: '视频/彩虹.jpg', zh: '如何预测彩虹', en: 'How to Predict a Rainbow', dur: '2:00' },
            { page: '东北冷涡.html', img: '视频/东北冷涡.jpg', zh: '东北冷涡是什么', en: 'What Is the Northeast Cold Vortex', dur: '1:47' },
            { page: '霰和冰雹.html', img: '视频/霰和冰雹.png', zh: '霰与冰雹的区别是什么', en: 'Graupel vs. Hail', dur: '2:24' },
            { page: '冻雨.html', img: '视频/冻雨.png', zh: '冻雨是什么', en: 'What Is Freezing Rain', dur: '1:36' },
            { page: '短时强降水.html', img: '视频/短时强降水.png', zh: '短时强降水是怎样形成的', en: 'How Do Short-Duration Heavy Rain Storms Form', dur: '3:04' },
            { page: '风暴潮.html', img: '视频/风暴潮.jpg', zh: '风暴潮是怎样形成的', en: 'How Storm Surge Forms', dur: '3:17' },
            { page: '回南天.html', img: '视频/回南天.jpg', zh: '回南天是什么', en: 'What Is Hui Nan Tian', dur: '1:56' },
            { page: '雷暴.html', img: '视频/雷暴.jpg', zh: '预测雷暴有多难', en: 'Why Thunderstorms Are Hard to Predict', dur: '3:10' },
            { page: '冷锋.html', img: '视频/冷锋.png', zh: '冷锋是什么', en: 'What Is a Cold Front', dur: '3:14' },
            { page: '立春.html', img: '视频/立春.png', zh: '如何定义立春', en: 'How We Define the Beginning of Spring', dur: '1:01' },
            { page: '暖锋.html', img: '视频/暖锋.png', zh: '暖锋是什么', en: 'What Is a Warm Front', dur: '1:05' },
            { page: '日晕.html', img: '视频/日晕.png', zh: '日晕是什么', en: 'What Is a Solar Halo', dur: '1:45' },
            { page: '气象网站视频.html', img: '视频/气象网站.png', zh: '宝藏气象网站推荐', en: 'Recommended Weather Websites (Earth Null School)', dur: '2:30' }
        ];

        function currentLang() {
            if (window.getCurrentLang) {
                return window.getCurrentLang();
            }
            return 'en';
        }

        function renderVideoGrid() {
            var grid = document.getElementById('video-grid');
            grid.innerHTML = '';
            var lang = currentLang();

            for (var i = 0; i < VIDEO_DATA.length; i++) {
                var v = VIDEO_DATA[i];
                var card = document.createElement('a');
                card.className = 'video-card';
                card.href = v.page;

                var thumbWrap = document.createElement('div');
                thumbWrap.className = 'video-thumb-wrap';

                var img = document.createElement('img');
                img.src = v.img;
                img.alt = v.en;
                img.loading = 'lazy';
                thumbWrap.appendChild(img);

                var overlay = document.createElement('div');
                overlay.className = 'play-overlay';
                thumbWrap.appendChild(overlay);

                var badge = document.createElement('span');
                badge.className = 'duration-badge';
                badge.textContent = v.dur;
                thumbWrap.appendChild(badge);

                var info = document.createElement('div');
                info.className = 'video-info';

                var title = document.createElement('div');
                title.className = 'video-title text';
                title.setAttribute('data-zh', v.zh);
                title.setAttribute('data-en', v.en);
                title.textContent = lang === 'zh' ? v.zh : v.en;
                info.appendChild(title);

                var sub = document.createElement('div');
                sub.className = 'video-sub text';
                sub.setAttribute('data-zh', 'Yiding (Leo) Luo');
                sub.setAttribute('data-en', 'Yiding (Leo) Luo');
                sub.textContent = 'Yiding (Leo) Luo';
                info.appendChild(sub);

                card.appendChild(thumbWrap);
                card.appendChild(info);
                grid.appendChild(card);
            }
        }

        // 初始化
        WindField.init('windFieldCanvas');
        renderVideoGrid();
        initLanguage();

        // 语言切换时重渲染（标题双语）
        window.registerLanguageChangeHandler(function () {
            renderVideoGrid();
        });
    </script>
</body>
</html>
